<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Studio Pro</title>
    <style>
        /* IMPORT NEW FONTS */
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Pacifico&family=Playfair+Display:wght@700&family=Quicksand:wght@500;700&family=Roboto+Mono:wght@500&display=swap');

        :root {
            --bg-room: #121212;
            --machine-shell: #f0f0f0;
            --accent: #ffb7b2; 
            --accent-btn: #ff9e99;
            --studio-light: #ffffff;
            --delete-red: #ff6b6b;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-room);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Dynamic background glow */
            background-image: 
                radial-gradient(circle at 50% 30%, var(--studio-light) 0%, transparent 60%),
                radial-gradient(#222 15%, transparent 16%);
            background-size: 100% 100%, 40px 40px;
            background-blend-mode: soft-light, normal;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* --- BOOTH STRUCTURE --- */
        .booth-structure {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 520px; height: 98vh; position: relative;
        }

        .top-light-cap {
            width: 100%; height: 80px; background: #fff;
            border-radius: 40px 40px 10px 10px; margin-bottom: 10px; z-index: 2;
            box-shadow: 0 0 10px #fff, 0 0 30px var(--studio-light), 0 0 80px var(--studio-light);
            border: 4px solid #fff; position: relative;
        }
        .top-light-cap::after {
            content: ''; position: absolute; top: 10%; left: 5%; width: 90%; height: 60%;
            background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
            border-radius: 40px; opacity: 0.8;
        }

        .booth-casing {
            flex: 1; width: 100%; background: var(--machine-shell);
            border-radius: 30px; padding: 15px; display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); position: relative;
        }

        .camera-deco { width: 100%; display: flex; justify-content: center; margin-bottom: 10px; }
        .lens-circle {
            width: 40px; height: 40px; background: #333; border-radius: 50%;
            border: 4px solid #ddd; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .lens-circle::after {
            content: ''; position: absolute; top: 25%; left: 25%; width: 50%; height: 50%;
            background: #111; border-radius: 50%; border: 2px solid #555;
        }

        .main-stage { flex: 1; display: flex; gap: 15px; position: relative; height: 100%; overflow: hidden; }

        .side-light {
            width: 25px; background: #fff; border-radius: 20px;
            box-shadow: 0 0 15px var(--studio-light), inset 0 0 10px rgba(255,255,255,0.8);
            transition: box-shadow 0.3s;
        }

        .screen-container {
            flex: 1; background: #fff; border-radius: 20px; position: relative;
            overflow: hidden; display: flex; flex-direction: column; border: 6px solid #333;
        }

        /* --- VIEWS --- */
        .view { flex: 1; display: none; flex-direction: column; position: relative; background: #fff; width: 100%; height: 100%; }
        .view.active { display: flex; }

        /* Start & Camera Styles (Same as before) */
        .start-view { justify-content: center; align-items: center; background: radial-gradient(circle at center, #fff 0%, #fff0f5 100%); }
        .logo-cloud { font-size: 5rem; margin-bottom: 10px; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .btn-main {
            padding: 16px 50px; background: var(--accent-btn); color: white;
            border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 700;
            box-shadow: 0 8px 20px rgba(255, 183, 178, 0.5); cursor: pointer;
        }

        .camera-area { flex: 1; position: relative; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .mirrored { transform: scaleX(-1); }
        .countdown {
            position: absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            font-size: 9rem; color: #fff; text-shadow: 0 5px 25px rgba(0,0,0,0.5);
            font-weight: 700; display: none; z-index: 20;
        }
        .cam-ui {
            height: 150px; background: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 10px; gap: 8px; border-top: 2px solid #eee;
        }
        .controls-row { display: flex; align-items: center; gap: 20px; width: 100%; justify-content: center; }
        .shutter-ring {
            width: 70px; height: 70px; border-radius: 50%; border: 4px solid var(--accent);
            padding: 4px; cursor: pointer;
        }
        .shutter-inner { width: 100%; height: 100%; background: var(--accent); border-radius: 50%; }
        .light-picker-btn {
            width: 45px; height: 45px; border-radius: 50%; overflow: hidden;
            border: 3px solid #eee; position: relative;
            background-image: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
        }
        input[type="color"] { position: absolute; top:-50%; left:-50%; width:200%; height:200%; opacity:0; cursor: pointer; }
        .btn-small { padding: 8px 15px; background: #eee; border-radius: 20px; font-size: 0.75rem; font-weight: 700; border: none; color: #666; cursor: pointer; }
        .btn-finish { background: #444; color: white; display: none; }

        /* Select View */
        .select-view { padding: 15px; background: #fafafa; }
        .layout-options { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .layout-btn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid #ddd; background: white; color: #888; font-weight: 700; cursor: pointer; }
        .layout-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow-y: auto; flex: 1; align-content: start; }
        .thumb-wrap { aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 3px solid transparent; cursor: pointer; opacity: 0.6; }
        .thumb-wrap.selected { border-color: var(--accent); opacity: 1; }
        .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }

        /* --- EDITOR VIEW (UPDATED) --- */
        .editor-view { background: #eef; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        canvas { max-width: 100%; max-height: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background: white; }
        
        .toolbar {
            background: #fff; padding: 10px; border-top: 1px solid #eee;
            display: flex; flex-direction: column; gap: 10px;
        }

        .tool-section {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; align-items: center;
        }

        /* Labeled Buttons */
        .tool-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-width: 60px; height: 60px; border: 1px solid #eee; border-radius: 10px;
            background: white; cursor: pointer; gap: 4px;
        }
        .tool-btn span.icon { font-size: 1.4rem; }
        .tool-btn span.label { font-size: 0.6rem; color: #666; font-weight: 700; text-transform: uppercase; }

        /* Context Menu (Active Object) */
        .context-bar {
            background: #f8f8f8; padding: 8px; border-radius: 8px;
            display: none; align-items: center; justify-content: space-between; gap: 10px;
        }
        .context-bar.active { display: flex; }

        .font-select {
            padding: 5px; border-radius: 5px; border: 1px solid #ccc; font-size: 0.8rem; flex: 1;
        }
        
        .delete-btn {
            background: var(--delete-red); color: white; border: none; 
            border-radius: 5px; padding: 5px 12px; font-weight: 700; font-size: 0.8rem;
        }

    </style>
</head>
<body>

<div class="booth-structure">
    <div class="top-light-cap"></div>
    <div class="booth-casing">
        <div class="camera-deco"><div class="lens-circle"></div></div>
        <div class="main-stage">
            <div class="side-light"></div>
            <div class="screen-container">
                
                <div id="view-start" class="view active start-view">
                    <div class="logo-cloud">☁️</div>
                    <h1>Cloud Studio</h1>
                    <button class="btn-main" onclick="startCamera()">Enter Booth</button>
                </div>

                <div id="view-camera" class="view">
                    <div class="camera-area">
                        <video id="video" class="mirrored" autoplay playsinline></video>
                        <div class="countdown" id="countdown">3</div>
                        <div id="flash-fx" style="position:absolute; inset:0; background:white; opacity:0; pointer-events:none;"></div>
                    </div>
                    <div class="cam-ui">
                        <div id="shot-status" style="font-size:0.8rem; font-weight:700;">Ready</div>
                        <div class="controls-row">
                            <div class="light-picker-btn">
                                <input type="color" oninput="changeStudioLight(this.value)" value="#ffffff">
                            </div>
                            <div class="shutter-ring" onclick="triggerCapture()"><div class="shutter-inner"></div></div>
                            <div class="icon-btn" onclick="toggleFlip()" style="font-size:1.2rem; cursor:pointer;">⇄</div>
                        </div>
                        <button id="btn-finish" class="btn-small btn-finish" onclick="finishSession()">Finish & Edit ➔</button>
                    </div>
                </div>

                <div id="view-select" class="view select-view">
                    <h4 style="text-align:center; margin:0 0 10px 0;">Choose Layout</h4>
                    <div class="layout-options" id="layout-buttons"></div>
                    <h4 id="select-instruction" style="text-align:center; margin:0 0 10px 0;">Select Photos</h4>
                    <div class="grid-container" id="thumb-grid"></div>
                    <button id="btn-confirm" class="btn-main" style="width:100%; opacity: 0.5; pointer-events: none;" onclick="goToEditor()">Make Photo</button>
                </div>

                <div id="view-edit" class="view editor-view">
                    <div class="canvas-area">
                        <canvas id="canvas"></canvas>
                    </div>
                    
                    <div class="toolbar">
                        
                        <div id="context-bar" class="context-bar">
                            <div id="text-controls" style="display:flex; gap:5px; flex:1;">
                                <select id="font-family" class="font-select" onchange="updateActiveFont(this.value)">
                                    <option value="Quicksand">Standard</option>
                                    <option value="Pacifico">Handwritten</option>
                                    <option value="Bangers">Comic</option>
                                    <option value="Playfair Display">Elegant</option>
                                    <option value="Roboto Mono">Mono</option>
                                </select>
                                <div style="position:relative; width:30px; height:30px; border-radius:50%; background:linear-gradient(45deg, #ccc, #999); border:1px solid #777;">
                                    <input type="color" id="text-color" style="opacity:0; width:100%; height:100%; cursor:pointer;" oninput="updateActiveColor(this.value)">
                                </div>
                            </div>
                            <button class="delete-btn" onclick="deleteActiveObject()">🗑 Delete</button>
                        </div>

                        <div class="tool-section">
                            <div class="tool-btn" style="border-color: #aaa; position: relative; overflow: hidden;">
                                <span class="icon" style="background: conic-gradient(#eee, #ddd, #ccc, #eee); -webkit-background-clip: text; color: transparent;">🎨</span>
                                <span class="label">Frame BG</span>
                                <input type="color" value="#ffffff" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;" oninput="setBgColor(this.value)">
                            </div>

                            <div style="width:1px; background:#ddd; height:40px; margin:0 5px;"></div>

                            <button class="tool-btn" onclick="addText()">
                                <span class="icon">Aa</span>
                                <span class="label">Text</span>
                            </button>

                            <button class="tool-btn" onclick="addSticker('☁️')">
                                <span class="icon">☁️</span>
                                <span class="label">Cloud</span>
                            </button>
                            <button class="tool-btn" onclick="addSticker('✨')">
                                <span class="icon">✨</span>
                                <span class="label">Sparkle</span>
                            </button>
                            <button class="tool-btn" onclick="addSticker('🎀')">
                                <span class="icon">🎀</span>
                                <span class="label">Bow</span>
                            </button>

                            <label class="tool-btn" style="border-color: var(--accent);">
                                <span class="icon">📷</span>
                                <span class="label">Add Photo</span>
                                <input type="file" hidden accept="image/*" onchange="addPhotoSticker(event)">
                            </label>
                        </div>
                        
                        <div style="display:flex; justify-content:space-between; margin-top:5px;">
                            <button onclick="location.reload()" style="background:transparent; border:none; color:#999; font-size:0.8rem;">Start Over</button>
                            <button onclick="download()" style="background:#444; color:white; border:none; padding:8px 20px; border-radius:20px; font-weight:bold;">⬇ Save</button>
                        </div>
                    </div>
                </div>

            </div>
            <div class="side-light"></div>
        </div>
    </div>
</div>

<script>
    const CONFIG = { w: 800, h: 1200, gap: 20 };
    const MAX_SHOTS = 8;
    
    let state = {
        photos: [], 
        selectedIndices: [], 
        targetCount: 4, 
        bgColor: '#ffffff',
        objects: [], 
        activeObj: null,
        isMirrored: true
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // --- 1. LIGHTING LOGIC ---
    function changeStudioLight(color) {
        document.documentElement.style.setProperty('--studio-light', color);
    }

    // --- 2. CAMERA LOGIC ---
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false });
            video.srcObject = stream;
            switchView('view-camera');
            updateCamUI();
        } catch(e) { alert("Camera access required."); }
    }
    function toggleFlip() {
        state.isMirrored = !state.isMirrored;
        video.classList.toggle('mirrored', state.isMirrored);
    }
    let isCapturing = false;
    function triggerCapture() {
        if(isCapturing || state.photos.length >= MAX_SHOTS) return;
        isCapturing = true;
        let count = 3;
        const countEl = document.getElementById('countdown');
        countEl.style.display = 'block'; countEl.innerText = count;
        const timer = setInterval(() => {
            count--;
            if(count > 0) countEl.innerText = count;
            else { clearInterval(timer); countEl.style.display = 'none'; snap(); }
        }, 1000);
    }
    function snap() {
        const flash = document.getElementById('flash-fx');
        flash.style.opacity = 1; setTimeout(() => flash.style.opacity = 0, 150);
        const c = document.createElement('canvas');
        c.width = 640; c.height = 480;
        const cx = c.getContext('2d');
        if(state.isMirrored) { cx.translate(640,0); cx.scale(-1,1); }
        // Cover fit
        const vw = video.videoWidth, vh = video.videoHeight;
        const aspect = 640/480;
        let sx, sy, sw, sh;
        if(vw/vh > aspect) { sh = vh; sw = sh*aspect; sy = 0; sx = (vw-sw)/2; }
        else { sw = vw; sh = sw/aspect; sx = 0; sy = (vh-sh)/2; }
        cx.drawImage(video, sx, sy, sw, sh, 0, 0, 640, 480);
        state.photos.push(c);
        isCapturing = false;
        updateCamUI();
        if(state.photos.length === MAX_SHOTS) finishSession();
    }
    function updateCamUI() {
        document.getElementById('shot-status').innerText = `${state.photos.length} / ${MAX_SHOTS} Photos`;
        document.getElementById('btn-finish').style.display = state.photos.length > 0 ? 'block' : 'none';
    }
    function finishSession() {
        if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        setupSelectionScreen();
    }

    // --- 3. SELECTION ---
    function setupSelectionScreen() {
        switchView('view-select');
        const count = state.photos.length;
        const layoutDiv = document.getElementById('layout-buttons');
        layoutDiv.innerHTML = '';
        const options = [1, 2, 4, 6, 8].filter(n => n <= count);
        let defaultOpt = options.includes(4) ? 4 : options[options.length-1];
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'layout-btn'; btn.innerText = opt;
            btn.onclick = () => setFrameTarget(opt, btn);
            if(opt === defaultOpt) { btn.classList.add('active'); state.targetCount = opt; }
            layoutDiv.appendChild(btn);
        });
        renderThumbnails(); updateSelectInstruction();
    }
    function setFrameTarget(n, btnEl) {
        state.targetCount = n;
        document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
        if(state.selectedIndices.length > n) state.selectedIndices = [];
        renderThumbnails(); updateSelectInstruction();
    }
    function renderThumbnails() {
        const grid = document.getElementById('thumb-grid'); grid.innerHTML = '';
        state.photos.forEach((photoCanvas, idx) => {
            const wrap = document.createElement('div'); wrap.className = 'thumb-wrap';
            if(state.selectedIndices.includes(idx)) wrap.classList.add('selected');
            const img = new Image(); img.src = photoCanvas.toDataURL();
            wrap.appendChild(img);
            wrap.onclick = () => toggleSelect(idx);
            grid.appendChild(wrap);
        });
        checkConfirmButton();
    }
    function toggleSelect(idx) {
        const i = state.selectedIndices.indexOf(idx);
        if(i > -1) state.selectedIndices.splice(i, 1);
        else if(state.selectedIndices.length < state.targetCount) state.selectedIndices.push(idx);
        renderThumbnails(); updateSelectInstruction();
    }
    function updateSelectInstruction() {
        const needed = state.targetCount; const current = state.selectedIndices.length;
        document.getElementById('select-instruction').innerText = `Select ${current} / ${needed}`;
    }
    function checkConfirmButton() {
        const btn = document.getElementById('btn-confirm');
        if(state.selectedIndices.length === state.targetCount) { btn.style.opacity = 1; btn.style.pointerEvents = 'auto'; }
        else { btn.style.opacity = 0.5; btn.style.pointerEvents = 'none'; }
    }
    function goToEditor() {
        switchView('view-edit');
        canvas.width = CONFIG.w; canvas.height = CONFIG.h;
        renderCanvas(); setupTouch();
    }

    // --- 4. RENDERER ---
    function renderCanvas() {
        ctx.fillStyle = state.bgColor;
        ctx.fillRect(0,0,CONFIG.w, CONFIG.h);

        const sel = state.selectedIndices.map(i => state.photos[i]);
        const num = state.targetCount; const g = CONFIG.gap;
        
        // Draw Grid
        if(num === 1) {
            const w = CONFIG.w - (g*2); const h = w * 0.75; 
            ctx.drawImage(sel[0], g, (CONFIG.h-h)/2, w, h);
        } else if (num === 2) {
            const w = CONFIG.w - (g*2); const h = w * 0.75; const startY = (CONFIG.h - ((h*2)+g))/2;
            sel.forEach((p, i) => ctx.drawImage(p, g, startY + i*(h+g), w, h));
        } else if (num === 4) {
            const w = (CONFIG.w - (g*3))/2; const h = w * 0.75; const startY = (CONFIG.h - ((h*2)+g))/2;
            sel.forEach((p, i) => { const col = i%2; const row = Math.floor(i/2); ctx.drawImage(p, g + col*(w+g), startY + row*(h+g), w, h); });
        } else if (num === 6) {
            const w = (CONFIG.w - (g*3))/2; const h = w * 0.75; const startY = (CONFIG.h - ((h*3)+(g*2)))/2;
            sel.forEach((p, i) => { const col = i%2; const row = Math.floor(i/2); ctx.drawImage(p, g + col*(w+g), startY + row*(h+g), w, h); });
        } else if (num === 8) {
            const w = (CONFIG.w - (g*3))/2; const h = w * 0.75; const startY = (CONFIG.h - ((h*4)+(g*3)))/2;
            sel.forEach((p, i) => { const col = i%2; const row = Math.floor(i/2); ctx.drawImage(p, g + col*(w+g), startY + row*(h+g), w, h); });
        }

        // Draw Objects
        state.objects.forEach(obj => {
            ctx.save();
            ctx.translate(obj.x, obj.y); ctx.rotate(obj.rot); ctx.scale(obj.scale, obj.scale);
            
            if(obj.type === 'text') {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                // USE OBJECT FONT AND COLOR
                ctx.font = `bold 50px "${obj.fontFamily}"`; 
                ctx.fillStyle = obj.color;
                ctx.fillText(obj.content, 0, 0);
            } 
            else if(obj.type === 'emoji') {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = '80px Quicksand'; 
                ctx.fillText(obj.content, 0, 0);
            }
            else if (obj.type === 'image') {
                const aspect = obj.img.width / obj.img.height;
                const baseH = 150; const baseW = baseH * aspect;
                ctx.drawImage(obj.img, -baseW/2, -baseH/2, baseW, baseH);
            }

            // Selection Outline
            if(state.activeObj === obj) {
                ctx.strokeStyle = '#ffb7b2'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI*2); ctx.stroke();
                // Handle for rotation
                ctx.fillStyle = '#ffb7b2'; ctx.beginPath(); ctx.arc(70, 0, 8, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        });
        
        updateToolbarState();
    }

    // --- 5. EDITOR UTILS ---
    function setBgColor(c) { state.bgColor = c; renderCanvas(); }
    
    function addText() { 
        const t = prompt("Enter Text:"); 
        if(t) addObject({ type:'text', content:t, fontFamily:'Quicksand', color:'#333333' }); 
    }
    
    function addSticker(s) { addObject({ type:'emoji', content:s }); }
    
    function addPhotoSticker(e) {
        const f = e.target.files[0]; if(!f) return;
        const img = new Image();
        img.onload = () => addObject({ type:'image', img: img });
        img.src = URL.createObjectURL(f);
    }
    
    function addObject(props) {
        state.objects.push({ x: CONFIG.w/2, y: CONFIG.h/2, scale: 1, rot: 0, ...props });
        state.activeObj = state.objects[state.objects.length-1]; 
        renderCanvas();
    }

    // NEW: Update active Object properties
    function updateActiveFont(font) {
        if(state.activeObj && state.activeObj.type === 'text') {
            state.activeObj.fontFamily = font;
            renderCanvas();
        }
    }
    function updateActiveColor(color) {
        if(state.activeObj && state.activeObj.type === 'text') {
            state.activeObj.color = color;
            renderCanvas();
        }
    }
    function deleteActiveObject() {
        if(state.activeObj) {
            const idx = state.objects.indexOf(state.activeObj);
            state.objects.splice(idx, 1);
            state.activeObj = null;
            renderCanvas();
        }
    }

    function updateToolbarState() {
        const bar = document.getElementById('context-bar');
        const textCtrls = document.getElementById('text-controls');
        
        if(state.activeObj) {
            bar.classList.add('active');
            // Show font/color only if it is text
            if(state.activeObj.type === 'text') {
                textCtrls.style.display = 'flex';
                document.getElementById('font-family').value = state.activeObj.fontFamily;
                document.getElementById('text-color').value = state.activeObj.color;
            } else {
                textCtrls.style.display = 'none';
            }
        } else {
            bar.classList.remove('active');
        }
    }

    function download() {
        state.activeObj = null; renderCanvas();
        const a = document.createElement('a');
        a.download = 'cloud_studio.png'; a.href = canvas.toDataURL(); a.click();
    }

    // --- 6. TOUCH ---
    function setupTouch() {
        let isDrag=false, isTransform=false;
        let lastP={x:0,y:0}, startAng=0, startDist=0;
        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx-r.left)*(canvas.width/r.width), y: (cy-r.top)*(canvas.height/r.height) };
        }
        canvas.addEventListener('pointerdown', e => {
            const p = getPos(e);
            if(state.activeObj) {
                const o = state.activeObj;
                const d = Math.hypot(p.x - o.x, p.y - o.y);
                if(d > 50*o.scale && d < 110*o.scale) {
                    isTransform = true; startAng = Math.atan2(p.y-o.y, p.x-o.x) - o.rot; startDist = d/o.scale; return;
                }
            }
            let hit = null;
            for(let i=state.objects.length-1; i>=0; i--) {
                const o = state.objects[i];
                if(Math.hypot(p.x-o.x, p.y-o.y) < 60*o.scale) { hit = o; break; }
            }
            state.activeObj = hit;
            if(hit) { isDrag = true; lastP = p; }
            renderCanvas();
        });
        canvas.addEventListener('pointermove', e => {
            if(!isDrag && !isTransform) return;
            const p = getPos(e); e.preventDefault();
            if(isTransform && state.activeObj) {
                const dx = p.x - state.activeObj.x; const dy = p.y - state.activeObj.y;
                state.activeObj.rot = Math.atan2(dy, dx) - startAng;
                state.activeObj.scale = Math.hypot(dx, dy) / startDist;
                renderCanvas();
            } else if(isDrag && state.activeObj) {
                state.activeObj.x += p.x - lastP.x; state.activeObj.y += p.y - lastP.y;
                lastP = p; renderCanvas();
            }
        });
        canvas.addEventListener('pointerup', () => { isDrag=false; isTransform=false; });
    }

    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
