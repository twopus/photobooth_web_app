<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUDIO 4-CUT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');

        :root {
            --bg: #f5f5f7;
            --kiosk-bg: #ffffff;
            --text: #1d1d1f;
            --accent: #000000;
            --border: #e5e5e5;
            --shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            overflow: hidden;
        }

        /* --- KIOSK SHELL --- */
        .kiosk-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--kiosk-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        .header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.9rem;
            z-index: 10;
        }

        /* --- VIEWS --- */
        .view {
            flex: 1;
            display: none; /* Hidden by default */
            flex-direction: column;
            position: relative;
            background: #fff;
        }
        .view.active { display: flex; }

        /* 1. START SCREEN */
        .start-screen {
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
        }
        .title-hero { font-size: 3rem; font-weight: 300; margin-bottom: 10px; letter-spacing: -2px; }
        .start-btn {
            margin-top: 40px;
            padding: 15px 50px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }

        /* 2. CAMERA SCREEN */
        .camera-container {
            flex: 1;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mirrored { transform: scaleX(-1); }
        
        .cam-overlay {
            position: absolute; bottom: 0; width: 100%; height: 120px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex; justify-content: center; align-items: center; gap: 30px;
        }
        
        .c-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            color: white; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(5px);
        }
        .shutter {
            width: 70px; height: 70px; background: white; border: 4px solid rgba(255,255,255,0.5);
        }
        .shutter:active { transform: scale(0.9); }

        .countdown-display {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: 700; display: none;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* 3. EDITOR SCREEN */
        .editor-area {
            flex: 1;
            background: #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        canvas {
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            max-width: 100%; max-height: 100%;
            background: white;
        }

        /* Toolbar */
        .toolbar {
            height: auto;
            min-height: 160px;
            background: #fff;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
            z-index: 20;
        }

        .tabs {
            display: flex; gap: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;
            margin-bottom: 5px;
        }
        .tab { 
            font-size: 0.85rem; font-weight: 600; color: #999; cursor: pointer; padding: 5px;
            transition: color 0.2s;
        }
        .tab.active { color: #000; border-bottom: 2px solid #000; }

        .controls-row {
            display: flex; gap: 10px; overflow-x: auto; 
            padding: 5px 0; align-items: center;
            scrollbar-width: none;
        }
        
        .tool-btn {
            min-width: 40px; height: 40px; border-radius: 8px;
            border: 1px solid #eee; background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer;
        }
        .tool-btn.active { background: #000; color: #fff; border-color: #000; }

        .color-input-wrapper {
            position: relative; width: 40px; height: 40px; border-radius: 50%; overflow: hidden;
            border: 2px solid #ddd;
        }
        input[type="color"] {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            cursor: pointer; border: none; padding: 0; margin: 0;
        }

        .action-bar {
            margin-top: auto; display: flex; gap: 10px;
        }
        .action-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer;
        }
        .btn-primary { background: #000; color: #fff; }
        .btn-sec { background: #f0f0f0; color: #000; }

    </style>
</head>
<body>

<div class="kiosk-container">
    <div class="header">STUDIO SELF</div>

    <div id="view-start" class="view active start-screen">
        <div class="title-hero">LIFE<br>CUTS</div>
        <p style="color:#666; font-size:0.9rem;">Modern Self-Photo Studio</p>
        <button class="start-btn" onclick="startCamera()">TOUCH TO START</button>
    </div>

    <div id="view-camera" class="view">
        <div class="camera-container">
            <video id="video" class="mirrored" autoplay playsinline></video>
            <div class="countdown-display" id="countdown">3</div>
            
            <div id="flash-fx" style="position:absolute; inset:0; background:white; opacity:0; pointer-events:none; transition:opacity 0.1s;"></div>
        </div>

        <div class="cam-overlay">
            <button class="c-btn" onclick="toggleFlip()" title="Flip">⇄</button>
            <button class="c-btn shutter" onclick="captureSequence()"></button>
            <button class="c-btn" title="Retake" onclick="resetCam()">✕</button>
        </div>
    </div>

    <div id="view-edit" class="view">
        <div class="editor-area">
            <canvas id="canvas"></canvas>
        </div>

        <div class="toolbar">
            <div class="tabs">
                <div class="tab active" onclick="setTab('layout')">Layout</div>
                <div class="tab" onclick="setTab('draw')">Draw</div>
                <div class="tab" onclick="setTab('decor')">Decor</div>
            </div>

            <div id="panel-layout" class="controls-row">
                <button class="tool-btn" onclick="setLayout('grid')">田</button>
                <button class="tool-btn" onclick="setLayout('strip')">llll</button>
                <div style="width:1px; height:20px; background:#ddd; margin:0 5px;"></div>
                <div class="color-input-wrapper" title="Frame Color">
                    <input type="color" id="bg-picker" value="#ffffff" oninput="setFrameColor(this.value)">
                </div>
                <button class="tool-btn" onclick="document.getElementById('frame-upload').click()" style="font-size:0.8rem; width:auto; padding:0 10px;">
                    Upload Frame
                </button>
                <input type="file" id="frame-upload" hidden accept="image/*" onchange="uploadFrame(event)">
            </div>

            <div id="panel-draw" class="controls-row" style="display:none;">
                <button class="tool-btn" id="pen-tool" onclick="togglePen(true)">✎</button>
                <div class="color-input-wrapper">
                    <input type="color" id="pen-color" value="#000000">
                </div>
                <input type="range" id="pen-size" min="2" max="20" value="5" style="width:100px;">
                <button class="tool-btn" onclick="undoDraw()">⎌</button>
                <button class="tool-btn" onclick="clearDraw()">🗑</button>
            </div>

            <div id="panel-decor" class="controls-row" style="display:none;">
                <button class="tool-btn" onclick="addText()">T</button>
                <button class="tool-btn" onclick="addSticker('🖤')">🖤</button>
                <button class="tool-btn" onclick="addSticker('✨')">✨</button>
                <button class="tool-btn" onclick="addSticker('🎀')">🎀</button>
                <button class="tool-btn" onclick="addSticker('🐰')">🐰</button>
            </div>

            <div class="action-bar">
                <button class="action-btn btn-sec" onclick="location.reload()">Reset</button>
                <button class="action-btn btn-primary" onclick="downloadImage()">Save Photo</button>
            </div>
        </div>
    </div>
</div>

<script>
    /* --- STATE MANAGEMENT --- */
    const state = {
        photos: [],     // Array of Canvas Elements (the raw captures)
        layout: 'grid', // 'grid' (2x2) or 'strip' (1x4)
        frameColor: '#ffffff',
        customOverlay: null, // Image object
        drawPaths: [],  // Array of {points:[], color, size}
        objects: [],    // Array of {type, content, x, y, scale, rot} (Text/Stickers)
        activeObj: null,
        isMirrored: true,
        isDrawing: false,
        penColor: '#000000',
        penSize: 5
    };

    const CONFIG = {
        w: 800, 
        h: 1200, // Master canvas resolution (High Quality)
        gap: 40,
        photoAspect: 4/3 
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // --- 1. CAMERA SYSTEM ---
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false 
            });
            video.srcObject = stream;
            switchView('view-camera');
        } catch (e) {
            alert("Please allow camera access.");
        }
    }

    function toggleFlip() {
        state.isMirrored = !state.isMirrored;
        video.classList.toggle('mirrored', state.isMirrored);
    }

    async function captureSequence() {
        state.photos = [];
        const btn = document.querySelector('.shutter');
        btn.disabled = true;

        for(let i=0; i<4; i++) {
            await countdown(3);
            snap();
            await new Promise(r => setTimeout(r, 1000));
        }

        btn.disabled = false;
        video.srcObject.getTracks().forEach(t => t.stop()); // Stop camera
        initEditor();
    }

    function countdown(seconds) {
        return new Promise(resolve => {
            const el = document.getElementById('countdown');
            el.style.display = 'block';
            el.innerText = seconds;
            
            let c = seconds;
            const timer = setInterval(() => {
                c--;
                if(c > 0) el.innerText = c;
                else {
                    clearInterval(timer);
                    el.style.display = 'none';
                    resolve();
                }
            }, 1000);
        });
    }

    function snap() {
        const flash = document.getElementById('flash-fx');
        flash.style.opacity = 1;
        setTimeout(() => flash.style.opacity = 0, 100);

        // Capture high-res frame
        const c = document.createElement('canvas');
        c.width = 640; c.height = 480; // 4:3
        const cx = c.getContext('2d');

        // Handle Mirroring
        if(state.isMirrored) {
            cx.translate(c.width, 0);
            cx.scale(-1, 1);
        }

        // Object Fit Cover logic
        const vW = video.videoWidth, vH = video.videoHeight;
        const aspect = c.width/c.height;
        let sx, sy, sw, sh;
        
        if(vW/vH > aspect) { // Video is wider
            sh = vH; sw = sh * aspect;
            sy = 0; sx = (vW - sw)/2;
        } else {
            sw = vW; sh = sw / aspect;
            sx = 0; sy = (vH - sh)/2;
        }

        cx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
        
        // Simple filter (brightness bump)
        // cx.filter = 'brightness(1.1)'; // (Optional, can be heavy)
        
        state.photos.push(c);
    }

    // --- 2. EDITOR SYSTEM ---
    function initEditor() {
        switchView('view-edit');
        canvas.width = CONFIG.w;
        canvas.height = CONFIG.h;
        renderCanvas();
        setupInteraction();
    }

    function renderCanvas() {
        // 1. Background Color
        ctx.fillStyle = state.frameColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Photos Layout
        if(state.layout === 'grid') {
            // 2x2 Grid with larger bottom margin for logo/signature
            const pW = (CONFIG.w - (CONFIG.gap*3)) / 2;
            const pH = pW * (3/4); // 4:3 Photo
            const startY = 100; // Top padding

            state.photos.forEach((p, i) => {
                const col = i % 2;
                const row = Math.floor(i / 2);
                const x = CONFIG.gap + (col * (pW + CONFIG.gap));
                const y = startY + (row * (pH + CONFIG.gap));
                ctx.drawImage(p, x, y, pW, pH);
            });
        } else {
            // Strip Layout (Vertical 1x4)
            const pW = CONFIG.w - (CONFIG.gap*4); // Narrower
            const pH = pW * (3/4);
            const totalH = (pH * 4) + (CONFIG.gap * 3);
            const startY = (CONFIG.h - totalH) / 2;

            state.photos.forEach((p, i) => {
                const x = (CONFIG.w - pW) / 2;
                const y = startY + (i * (pH + CONFIG.gap));
                ctx.drawImage(p, x, y, pW, pH);
            });
        }

        // 3. Custom Frame Overlay
        if(state.customOverlay) {
            ctx.drawImage(state.customOverlay, 0, 0, CONFIG.w, CONFIG.h);
        }

        // 4. Drawings
        state.drawPaths.forEach(path => {
            if(path.points.length < 2) return;
            ctx.beginPath();
            ctx.strokeStyle = path.color;
            ctx.lineWidth = path.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.moveTo(path.points[0].x, path.points[0].y);
            for(let i=1; i<path.points.length; i++){
                ctx.lineTo(path.points[i].x, path.points[i].y);
            }
            ctx.stroke();
        });

        // 5. Objects (Text/Stickers)
        state.objects.forEach(obj => {
            ctx.save();
            ctx.translate(obj.x, obj.y);
            ctx.rotate(obj.rot);
            ctx.scale(obj.scale, obj.scale);
            
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "bold 60px Inter"; // Base font size
            
            if(obj.type === 'text') {
                ctx.fillStyle = "#000"; // Or dynamic color
                ctx.fillText(obj.content, 0, 0);
            } else {
                ctx.fillText(obj.content, 0, 0); // Emoji
            }

            // Selection Box
            if(state.activeObj === obj && !state.isDrawing) {
                ctx.strokeStyle = "#3b82f6";
                ctx.lineWidth = 2;
                const m = ctx.measureText(obj.content);
                const w = m.width + 40;
                const h = 80;
                ctx.strokeRect(-w/2, -h/2, w, h);
                
                // Handle
                ctx.fillStyle = "#3b82f6";
                ctx.beginPath();
                ctx.arc(w/2, h/2, 10, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        });
    }

    /* --- EDITING TOOLS --- */
    function setLayout(type) {
        state.layout = type;
        renderCanvas();
    }

    function setFrameColor(hex) {
        state.frameColor = hex;
        renderCanvas();
    }

    function uploadFrame(e) {
        const f = e.target.files[0];
        if(f) {
            const img = new Image();
            img.onload = () => {
                state.customOverlay = img;
                renderCanvas();
            };
            img.src = URL.createObjectURL(f);
        }
    }

    /* --- DRAWING LOGIC --- */
    function togglePen(active) {
        state.isDrawing = active;
        state.activeObj = null; // Deselect text
        document.getElementById('pen-tool').classList.toggle('active', active);
        renderCanvas();
    }

    function undoDraw() {
        state.drawPaths.pop();
        renderCanvas();
    }
    
    function clearDraw() {
        state.drawPaths = [];
        renderCanvas();
    }

    /* --- OBJECT LOGIC --- */
    function addText() {
        const txt = prompt("Enter text:");
        if(txt) {
            togglePen(false);
            state.objects.push({
                type: 'text', content: txt,
                x: CONFIG.w/2, y: CONFIG.h/2, scale: 1, rot: 0
            });
            state.activeObj = state.objects[state.objects.length-1];
            renderCanvas();
        }
    }
    
    function addSticker(emoji) {
        togglePen(false);
        state.objects.push({
            type: 'sticker', content: emoji,
            x: CONFIG.w/2, y: CONFIG.h/2, scale: 1, rot: 0
        });
        state.activeObj = state.objects[state.objects.length-1];
        renderCanvas();
    }

    /* --- INTERACTION HANDLER --- */
    function setupInteraction() {
        let isDrag = false;
        let isTransform = false;
        let lastPos = {x:0, y:0};
        let startAngle = 0;
        let startScale = 0;
        let currentPath = null;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('pointerdown', e => {
            const pos = getPos(e);

            if(state.isDrawing) {
                isDrag = true;
                currentPath = {
                    points: [{x: pos.x, y: pos.y}],
                    color: document.getElementById('pen-color').value,
                    size: parseInt(document.getElementById('pen-size').value)
                };
                state.drawPaths.push(currentPath);
                renderCanvas();
                return;
            }

            // Object Interaction
            // 1. Check Handle (Transform)
            if(state.activeObj) {
                // Approximate handle location check (simplified math for brevity)
                const o = state.activeObj;
                const dist = Math.hypot(pos.x - o.x, pos.y - o.y);
                if(dist > 50 && dist < 150) { // Rough check for handle area relative to center
                    // Real implementation requires matrix mapping, simplified here:
                    isTransform = true;
                    startAngle = Math.atan2(pos.y - o.y, pos.x - o.x) - o.rot;
                    startScale = Math.hypot(pos.x - o.x, pos.y - o.y) / o.scale;
                    return;
                }
            }

            // 2. Check Hit
            let hit = null;
            // Iterate reverse to select top item
            for(let i=state.objects.length-1; i>=0; i--){
                const o = state.objects[i];
                if(Math.hypot(pos.x - o.x, pos.y - o.y) < 80 * o.scale) {
                    hit = o; break;
                }
            }
            
            state.activeObj = hit;
            if(hit) {
                isDrag = true;
                lastPos = pos;
            }
            renderCanvas();
        });

        canvas.addEventListener('pointermove', e => {
            if(!isDrag && !isTransform) return;
            const pos = getPos(e);
            e.preventDefault();

            if(state.isDrawing && isDrag) {
                currentPath.points.push({x: pos.x, y: pos.y});
                renderCanvas();
            } else if (isTransform && state.activeObj) {
                const dx = pos.x - state.activeObj.x;
                const dy = pos.y - state.activeObj.y;
                state.activeObj.rot = Math.atan2(dy, dx) - startAngle;
                state.activeObj.scale = Math.hypot(dx, dy) / startScale;
                renderCanvas();
            } else if (isDrag && state.activeObj) {
                state.activeObj.x += pos.x - lastPos.x;
                state.activeObj.y += pos.y - lastPos.y;
                lastPos = pos;
                renderCanvas();
            }
        });

        canvas.addEventListener('pointerup', () => {
            isDrag = false; isTransform = false; currentPath = null;
        });
    }

    /* --- UTILS --- */
    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function setTab(name) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.controls-row').forEach(r => r.style.display = 'none');
        
        // Find clicked tab and activate
        const tabs = document.querySelectorAll('.tab');
        if(name === 'layout') { tabs[0].classList.add('active'); document.getElementById('panel-layout').style.display='flex'; togglePen(false); }
        if(name === 'draw') { tabs[1].classList.add('active'); document.getElementById('panel-draw').style.display='flex'; togglePen(true); }
        if(name === 'decor') { tabs[2].classList.add('active'); document.getElementById('panel-decor').style.display='flex'; togglePen(false); }
    }

    function downloadImage() {
        state.activeObj = null; // Hide handles
        renderCanvas();
        const a = document.createElement('a');
        a.download = 'studio_4cut.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    }

</script>
</body>
</html>
