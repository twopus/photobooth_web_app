<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Studio Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

        :root {
            --bg-room: #1a1a1a;
            --machine-shell: #fdfdfd;
            --accent: #ffb7b2; 
            --accent-btn: #ff9e99;
            --studio-light: #ffffff; /* This changes dynamically */
            --shadow-intensity: 20px;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-room);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Dark room floor pattern */
            background-image: radial-gradient(#333 15%, transparent 16%);
            background-size: 40px 40px;
            overflow: hidden;
        }

        /* --- THE BOOTH MACHINE --- */
        .booth-casing {
            width: 100%;
            max-width: 500px;
            height: 98vh;
            background: var(--machine-shell);
            border-radius: 45px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            
            /* DYNAMIC STUDIO LIGHTING GLOW */
            box-shadow: 
                0 0 0 10px #e0e0e0, /* Plastic rim */
                0 0 60px var(--studio-light); /* The colored glow */
            transition: box-shadow 0.5s ease;
        }

        .camera-hole {
            width: 18px; height: 18px; background: #000; border-radius: 50%;
            align-self: center; margin-bottom: 15px;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.8);
            border: 2px solid #ccc;
        }

        /* --- SCREEN BEZEL --- */
        .screen-container {
            flex: 1;
            background: #fff;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #333;
            /* Inner screen reflection */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* --- VIEWS --- */
        .view {
            flex: 1;
            display: none;
            flex-direction: column;
            position: relative;
            background: #fff;
            width: 100%; height: 100%;
        }
        .view.active { display: flex; }

        /* 1. START */
        .start-view {
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #fff 0%, #fff0f5 100%);
        }
        .logo-cloud { font-size: 5rem; margin-bottom: 10px; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .btn-main {
            padding: 16px 50px; background: var(--accent-btn); color: white;
            border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 700;
            box-shadow: 0 8px 20px rgba(255, 183, 178, 0.5);
            transition: transform 0.1s; cursor: pointer;
        }
        .btn-main:active { transform: scale(0.96); }

        /* 2. CAMERA */
        .camera-area {
            flex: 1; position: relative; background: #000; overflow: hidden;
            border-radius: 20px 20px 0 0;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .mirrored { transform: scaleX(-1); }

        .countdown {
            position: absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            font-size: 9rem; color: #fff; text-shadow: 0 5px 25px rgba(0,0,0,0.5);
            font-weight: 700; display: none; z-index: 20;
        }

        .cam-ui {
            height: 160px; background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; z-index: 10; gap: 10px;
        }
        
        .controls-row {
            display: flex; align-items: center; gap: 25px; width: 100%; justify-content: center;
        }

        .shutter-ring {
            width: 75px; height: 75px; border-radius: 50%;
            border: 4px solid var(--accent); padding: 4px; cursor: pointer;
        }
        .shutter-inner {
            width: 100%; height: 100%; background: var(--accent); border-radius: 50%;
            transition: transform 0.2s;
        }
        .shutter-ring:active .shutter-inner { transform: scale(0.85); }

        /* Light Color Picker */
        .light-picker-btn {
            width: 45px; height: 45px; border-radius: 50%; overflow: hidden;
            border: 3px solid #eee; position: relative;
            background-image: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input[type="color"] {
            position: absolute; top:-50%; left:-50%; width:200%; height:200%; opacity:0; cursor: pointer;
        }

        .btn-small {
            padding: 8px 20px; background: #eee; border-radius: 20px; font-size: 0.8rem; font-weight: 700; border: none; color: #666;
        }
        .btn-finish {
            background: #444; color: white; display: none; /* Hidden until 1st photo */
        }

        /* 3. SELECTION SCREEN */
        .select-view { padding: 20px; background: #fafafa; }
        
        .layout-options {
            display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px;
            justify-content: center;
        }
        .layout-btn {
            width: 40px; height: 40px; border-radius: 8px; border: 1px solid #ddd;
            background: white; color: #888; font-weight: 700; cursor: pointer;
        }
        .layout-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .grid-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            overflow-y: auto; padding-bottom: 20px; flex: 1; align-content: start;
        }
        .thumb-wrap {
            position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
            border: 3px solid transparent; cursor: pointer; opacity: 0.6; transition: 0.2s;
        }
        .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-wrap.selected { border-color: var(--accent); opacity: 1; transform: scale(1.05); z-index: 2; }
        .thumb-wrap.selected::after {
            content: '✓'; position: absolute; top:5px; right:5px;
            background: var(--accent); color: white; width: 20px; height: 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem;
        }

        /* 4. EDITOR */
        .editor-view { background: #eef; }
        .canvas-area {
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        canvas {
            max-width: 100%; max-height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); background: white;
        }
        .toolbar {
            background: #fff; padding: 15px; border-top: 1px solid #eee;
        }
        .tool-scroll {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; align-items: center;
        }
        .icon-btn {
            min-width: 45px; height: 45px; border-radius: 12px; border: 1px solid #eee;
            background: #fff; font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
        }

    </style>
</head>
<body>

<div class="booth-casing">
    <div class="camera-hole"></div>
    <div class="screen-container">
        
        <div id="view-start" class="view active start-view">
            <div class="logo-cloud">☁️</div>
            <h1 style="margin:0; color:#555;">Cloud Studio</h1>
            <p style="color:#aaa; font-size:0.9rem;">Interactive Booth</p>
            <button class="btn-main" onclick="startCamera()">Enter Booth</button>
        </div>

        <div id="view-camera" class="view">
            <div class="camera-area">
                <video id="video" class="mirrored" autoplay playsinline></video>
                <div class="countdown" id="countdown">3</div>
                <div id="flash-fx" style="position:absolute; inset:0; background:white; opacity:0; pointer-events:none; transition:0.1s;"></div>
            </div>
            
            <div class="cam-ui">
                <div id="shot-status" style="font-size:0.9rem; font-weight:700; color:#444;">Ready</div>
                
                <div class="controls-row">
                    <div class="light-picker-btn" title="Studio Lights">
                        <input type="color" oninput="changeStudioLight(this.value)">
                    </div>

                    <div class="shutter-ring" onclick="triggerCapture()">
                        <div class="shutter-inner"></div>
                    </div>

                    <div class="icon-btn" onclick="toggleFlip()" style="width:45px; height:45px; border-radius:50%; font-size:1rem;">⇄</div>
                </div>

                <button id="btn-finish" class="btn-small btn-finish" onclick="finishSession()">Finish & Edit ➔</button>
            </div>
        </div>

        <div id="view-select" class="view select-view">
            <h4 style="text-align:center; margin:0 0 10px 0; color:#666;">1. Choose Frame Style</h4>
            <div class="layout-options" id="layout-buttons">
                </div>

            <h4 id="select-instruction" style="text-align:center; margin:0 0 10px 0; color:#444;">2. Select Photos</h4>
            <div class="grid-container" id="thumb-grid"></div>
            
            <button id="btn-confirm" class="btn-main" style="width:100%; opacity: 0.5; pointer-events: none;" onclick="goToEditor()">
                Make Photo
            </button>
        </div>

        <div id="view-edit" class="view editor-view">
            <div class="canvas-area">
                <canvas id="canvas"></canvas>
            </div>
            <div class="toolbar">
                <div class="tool-scroll">
                    <div class="icon-btn" style="position:relative; overflow:hidden;">
                        🎨
                        <input type="color" value="#ffffff" style="position:absolute; top:-10px; left:-10px; width:200%; height:200%; opacity:0;" oninput="setBgColor(this.value)">
                    </div>

                    <button class="icon-btn" onclick="addText()">T</button>
                    <button class="icon-btn" onclick="addSticker('☁️')">☁️</button>
                    <button class="icon-btn" onclick="addSticker('✨')">✨</button>
                    <button class="icon-btn" onclick="addSticker('🎀')">🎀</button>

                    <label class="icon-btn" style="position:relative;">
                        📷
                        <input type="file" hidden accept="image/*" onchange="addPhotoSticker(event)">
                    </label>

                    <div style="width:1px; background:#ccc; height:30px; margin:0 5px;"></div>
                    <button class="icon-btn" onclick="download()" style="background:#444; color:white; border:none;">⬇</button>
                    <button class="icon-btn" onclick="location.reload()" style="font-size:0.9rem;">↻</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const CONFIG = { w: 800, h: 1200, gap: 20 };
    const MAX_SHOTS = 8;
    
    let state = {
        photos: [], 
        selectedIndices: [], 
        targetCount: 4, // Default frame size
        bgColor: '#ffffff',
        objects: [], 
        activeObj: null,
        isMirrored: true
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // --- 1. STUDIO LIGHTING ---
    function changeStudioLight(color) {
        // Changes CSS Variable to glow the surrounding booth
        document.documentElement.style.setProperty('--studio-light', color);
    }

    // --- 2. CAMERA ---
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false });
            video.srcObject = stream;
            switchView('view-camera');
            updateCamUI();
        } catch(e) { alert("Camera access required."); }
    }

    function toggleFlip() {
        state.isMirrored = !state.isMirrored;
        video.classList.toggle('mirrored', state.isMirrored);
    }

    let isCapturing = false;
    
    function triggerCapture() {
        if(isCapturing || state.photos.length >= MAX_SHOTS) return;
        isCapturing = true;

        // Countdown
        let count = 3;
        const countEl = document.getElementById('countdown');
        countEl.style.display = 'block';
        countEl.innerText = count;

        const timer = setInterval(() => {
            count--;
            if(count > 0) {
                countEl.innerText = count;
            } else {
                clearInterval(timer);
                countEl.style.display = 'none';
                snap();
            }
        }, 1000);
    }

    function snap() {
        // Flash
        const flash = document.getElementById('flash-fx');
        flash.style.opacity = 1;
        setTimeout(() => flash.style.opacity = 0, 150);

        // Capture
        const c = document.createElement('canvas');
        c.width = 640; c.height = 480;
        const cx = c.getContext('2d');
        if(state.isMirrored) { cx.translate(640,0); cx.scale(-1,1); }
        
        // Fit Logic
        const vw = video.videoWidth, vh = video.videoHeight;
        const aspect = 640/480;
        let sx, sy, sw, sh;
        if(vw/vh > aspect) { sh = vh; sw = sh*aspect; sy = 0; sx = (vw-sw)/2; }
        else { sw = vw; sh = sw/aspect; sx = 0; sy = (vh-sh)/2; }

        cx.drawImage(video, sx, sy, sw, sh, 0, 0, 640, 480);
        
        // Note: No tinting here! The light is purely environmental (CSS).
        state.photos.push(c);
        
        isCapturing = false;
        updateCamUI();

        if(state.photos.length === MAX_SHOTS) {
            finishSession();
        }
    }

    function updateCamUI() {
        document.getElementById('shot-status').innerText = `${state.photos.length} / ${MAX_SHOTS} Photos`;
        // Show finish button if at least 1 photo taken
        const btn = document.getElementById('btn-finish');
        btn.style.display = state.photos.length > 0 ? 'block' : 'none';
    }

    function finishSession() {
        video.srcObject.getTracks().forEach(t => t.stop());
        setupSelectionScreen();
    }

    // --- 3. DYNAMIC SELECTION ---
    function setupSelectionScreen() {
        switchView('view-select');
        const count = state.photos.length;
        const layoutDiv = document.getElementById('layout-buttons');
        layoutDiv.innerHTML = '';

        // Determine available frames (1, 2, 4, 6, 8)
        // Rule: frame size must be <= photos taken.
        const options = [1, 2, 4, 6, 8].filter(n => n <= count);

        // Default to the largest possible even number, or 1
        let defaultOpt = options.includes(4) ? 4 : options[options.length-1];

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'layout-btn';
            btn.innerText = opt + (opt===1?'':' Cuts');
            btn.onclick = () => setFrameTarget(opt, btn);
            if(opt === defaultOpt) {
                btn.classList.add('active');
                state.targetCount = opt;
            }
            layoutDiv.appendChild(btn);
        });

        // Render Thumbnails
        renderThumbnails();
        updateSelectInstruction();
    }

    function setFrameTarget(n, btnEl) {
        state.targetCount = n;
        document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
        
        // Clear previous selection if it exceeds new target, or keep valid ones
        if(state.selectedIndices.length > n) {
            state.selectedIndices = [];
        }
        
        renderThumbnails();
        updateSelectInstruction();
    }

    function renderThumbnails() {
        const grid = document.getElementById('thumb-grid');
        grid.innerHTML = '';
        
        state.photos.forEach((photoCanvas, idx) => {
            const wrap = document.createElement('div');
            wrap.className = 'thumb-wrap';
            if(state.selectedIndices.includes(idx)) wrap.classList.add('selected');
            
            const img = new Image();
            img.src = photoCanvas.toDataURL();
            wrap.appendChild(img);
            
            wrap.onclick = () => toggleSelect(idx);
            grid.appendChild(wrap);
        });
        checkConfirmButton();
    }

    function toggleSelect(idx) {
        const i = state.selectedIndices.indexOf(idx);
        if(i > -1) {
            state.selectedIndices.splice(i, 1);
        } else {
            if(state.selectedIndices.length < state.targetCount) {
                state.selectedIndices.push(idx);
            }
        }
        renderThumbnails(); // Re-render to show selection styling
        updateSelectInstruction();
    }

    function updateSelectInstruction() {
        const needed = state.targetCount;
        const current = state.selectedIndices.length;
        document.getElementById('select-instruction').innerText = `2. Select ${current} / ${needed} Photos`;
    }

    function checkConfirmButton() {
        const btn = document.getElementById('btn-confirm');
        if(state.selectedIndices.length === state.targetCount) {
            btn.style.opacity = 1;
            btn.style.pointerEvents = 'auto';
        } else {
            btn.style.opacity = 0.5;
            btn.style.pointerEvents = 'none';
        }
    }

    function goToEditor() {
        switchView('view-edit');
        canvas.width = CONFIG.w; 
        canvas.height = CONFIG.h;
        renderCanvas();
        setupTouch();
    }

    // --- 4. RENDER LAYOUTS (1, 2, 4, 6, 8) ---
    function renderCanvas() {
        // BG
        ctx.fillStyle = state.bgColor;
        ctx.fillRect(0,0,CONFIG.w, CONFIG.h);

        const sel = state.selectedIndices.map(i => state.photos[i]);
        const num = state.targetCount;
        const g = CONFIG.gap;
        
        // Define Layout Geometry
        if(num === 1) {
            // Big single photo
            const w = CONFIG.w - (g*2);
            const h = w * 0.75; 
            ctx.drawImage(sel[0], g, (CONFIG.h-h)/2, w, h);
        } 
        else if (num === 2) {
            // Vertical Strip (2 stacked)
            const w = CONFIG.w - (g*2);
            const h = w * 0.75;
            const totalH = (h*2) + g;
            const startY = (CONFIG.h - totalH)/2;
            sel.forEach((p, i) => {
                ctx.drawImage(p, g, startY + i*(h+g), w, h);
            });
        }
        else if (num === 4) {
            // 2x2 Grid
            const w = (CONFIG.w - (g*3))/2;
            const h = w * 0.75;
            const startY = (CONFIG.h - ((h*2)+g))/2;
            sel.forEach((p, i) => {
                const col = i%2; const row = Math.floor(i/2);
                ctx.drawImage(p, g + col*(w+g), startY + row*(h+g), w, h);
            });
        }
        else if (num === 6) {
            // 2x3 Grid
            const w = (CONFIG.w - (g*3))/2;
            const h = w * 0.75;
            const startY = (CONFIG.h - ((h*3)+(g*2)))/2;
            sel.forEach((p, i) => {
                const col = i%2; const row = Math.floor(i/2);
                ctx.drawImage(p, g + col*(w+g), startY + row*(h+g), w, h);
            });
        }
        else if (num === 8) {
            // 2x4 Grid (Small)
            const w = (CONFIG.w - (g*3))/2;
            const h = w * 0.75;
            const startY = (CONFIG.h - ((h*4)+(g*3)))/2;
            sel.forEach((p, i) => {
                const col = i%2; const row = Math.floor(i/2);
                ctx.drawImage(p, g + col*(w+g), startY + row*(h+g), w, h);
            });
        }

        // Render Stickers/Text
        state.objects.forEach(obj => {
            ctx.save();
            ctx.translate(obj.x, obj.y);
            ctx.rotate(obj.rot);
            ctx.scale(obj.scale, obj.scale);

            if(obj.type === 'text' || obj.type === 'emoji') {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = 'bold 50px Quicksand';
                ctx.fillStyle = '#333';
                ctx.fillText(obj.content, 0, 0);
            } else if (obj.type === 'image') {
                const aspect = obj.img.width / obj.img.height;
                const baseH = 150; const baseW = baseH * aspect;
                ctx.drawImage(obj.img, -baseW/2, -baseH/2, baseW, baseH);
            }

            if(state.activeObj === obj) {
                ctx.strokeStyle = state.bgColor === '#ffffff' ? '#ffb7b2' : '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI*2); ctx.stroke();
                ctx.fillStyle = ctx.strokeStyle;
                ctx.beginPath(); ctx.arc(60, 0, 8, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        });
    }

    // --- 5. EDITOR UTILS ---
    function setBgColor(c) { state.bgColor = c; renderCanvas(); }
    function addText() { const t = prompt("Text:"); if(t) addObject({ type:'text', content:t }); }
    function addSticker(s) { addObject({ type:'emoji', content:s }); }
    function addPhotoSticker(e) {
        const f = e.target.files[0]; if(!f) return;
        const img = new Image();
        img.onload = () => addObject({ type:'image', img: img });
        img.src = URL.createObjectURL(f);
    }
    function addObject(props) {
        const obj = { x: CONFIG.w/2, y: CONFIG.h/2, scale: 1, rot: 0, ...props };
        state.objects.push(obj); state.activeObj = obj; renderCanvas();
    }
    function download() {
        state.activeObj = null; renderCanvas();
        const a = document.createElement('a');
        a.download = 'cloud_studio.png';
        a.href = canvas.toDataURL();
        a.click();
    }

    // --- 6. TOUCH ---
    function setupTouch() {
        let isDrag=false, isTransform=false;
        let lastP={x:0,y:0}, startAng=0, startDist=0;

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx-r.left)*(canvas.width/r.width), y: (cy-r.top)*(canvas.height/r.height) };
        }

        canvas.addEventListener('pointerdown', e => {
            const p = getPos(e);
            if(state.activeObj) {
                const o = state.activeObj;
                const d = Math.hypot(p.x - o.x, p.y - o.y);
                if(d > 40*o.scale && d < 100*o.scale) {
                    isTransform = true; startAng = Math.atan2(p.y-o.y, p.x-o.x) - o.rot; startDist = d/o.scale; return;
                }
            }
            let hit = null;
            for(let i=state.objects.length-1; i>=0; i--) {
                const o = state.objects[i];
                if(Math.hypot(p.x-o.x, p.y-o.y) < 50*o.scale) { hit = o; break; }
            }
            state.activeObj = hit;
            if(hit) { isDrag = true; lastP = p; }
            renderCanvas();
        });

        canvas.addEventListener('pointermove', e => {
            if(!isDrag && !isTransform) return;
            const p = getPos(e); e.preventDefault();
            if(isTransform && state.activeObj) {
                const dx = p.x - state.activeObj.x; const dy = p.y - state.activeObj.y;
                state.activeObj.rot = Math.atan2(dy, dx) - startAng;
                state.activeObj.scale = Math.hypot(dx, dy) / startDist;
                renderCanvas();
            } else if(isDrag && state.activeObj) {
                state.activeObj.x += p.x - lastP.x; state.activeObj.y += p.y - lastP.y;
                lastP = p; renderCanvas();
            }
        });
        canvas.addEventListener('pointerup', () => { isDrag=false; isTransform=false; });
    }

    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
