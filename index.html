<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="booth-structure">
  <div class="top-light-cap"></div>
  <div class="booth-casing">
    <div class="camera-deco"><div class="lens-circle"></div></div>
    <div class="main-stage">
      <div class="side-light"></div>
      <div class="screen-container">

        <!-- Start View -->
        <div id="view-start" class="view active start-view">
          <div class="logo-cloud">☁️</div>
          <h1>Cloud Studio</h1>
          <button class="btn-main" onclick="startCamera()">Enter Booth</button>
        </div>

        <!-- Camera View -->
        <div id="view-camera" class="view">
          <div class="camera-area">
            <video id="video" class="mirrored" autoplay playsinline></video>
            <div class="light-hue"></div>
            <div class="countdown" id="countdown">3</div>
            <div id="flash-fx"></div>
          </div>
          <div class="cam-ui">
            <div class="status-row">
              <div id="shot-status">0 / 8</div>
              <button onclick="toggleInvert()" class="btn-small invert-btn">⇄</button>
            </div>

            <div id="live-filter-bar"></div>

            <div class="controls-row">
              <div id="shutter-btn" class="shutter-ring"><div class="shutter-inner"></div></div>
            </div>
            <button id="btn-finish" class="btn-finish">Finish & Edit →</button>
          </div>
        </div>

        <!-- Selection View -->
        <div id="view-select" class="view select-view">
          <h4>Layout</h4>
          <div class="layout-options" id="layout-buttons"></div>
          <div id="sub-options" class="sub-options"></div>

          <h4 id="select-instruction">Select Photos</h4>
          <div class="grid-container" id="thumb-grid"></div>

          <div class="select-actions">
            <button class="btn-small retake-btn" onclick="startCamera()">Take More Photos</button>
            <button id="btn-confirm" class="btn-main" disabled onclick="goToEditor()">Design</button>
          </div>
        </div>

        <!-- Editor View -->
        <div id="view-edit" class="view editor-view">
          <div class="editor-controls">
            <button class="tool-btn" onclick="undo()" title="Undo">
              <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7v6h6M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/>
              </svg>
            </button>
            <button class="tool-btn" onclick="redo()" title="Redo">
              <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 7v6h-6M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"/>
              </svg>
            </button>
            <button class="tool-btn back-btn" onclick="switchView('view-select')">← Back</button>
          </div>

          <div class="editor-main">
            <div class="canvas-area">
              <canvas id="canvas"></canvas>
              <div class="zoom-bar">
                <span>Zoom</span>
                <input class="range-cute" type="range" min="0.5" max="2" step="0.05" value="1" oninput="setZoom(this.value)">
              </div>
            </div>

            <div class="toolbar">
              <!-- Filter Menu -->
              <div id="filter-menu" class="context-bar">
                <button class="btn-small" onclick="setFilter('none')">Normal</button>
                <button class="btn-small" onclick="setFilter('bw')">B&W</button>
                <button class="btn-small" onclick="setFilter('vintage')">Vintage</button>
                <button class="btn-small" onclick="setFilter('retro')">Retro</button>
                <button class="btn-small" onclick="setFilter('cool')">Cool</button>
                <button class="btn-small" onclick="setFilter('warm')">Warm</button>
                <button class="btn-small" onclick="setFilter('peach')">Peach</button>
                <button class="btn-small" onclick="setFilter('milk')">Milk</button>
                <button class="btn-small" onclick="setFilter('film')">Film</button>
                <button class="btn-small" onclick="setFilter('bright')">Bright</button>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-size:0.7rem;">Strength</span>
                  <input class="range-cute" type="range" min="0" max="1" step="0.05" value="0.8" oninput="setFilterIntensity(this.value)">
                </div>
              </div>

              <!-- Background Menu -->
              <div id="bg-menu" class="context-bar">
                <div class="color-wheel-container">
                  <span style="font-size: 0.85rem; font-weight: 700;">Background:</span>
                  <input type="color" id="bg-color-input" value="#ffffff" oninput="state.bgColor = this.value; renderCanvas();">
                  <button class="btn-small" onclick="document.getElementById('bg-image-input').click()">+ Image</button>
                  <input type="file" id="bg-image-input" accept="image/*" style="display:none;" onchange="addBgImage(event)">
                </div>
              </div>

              <!-- Draw Menu -->
              <div id="draw-menu" class="context-bar">
                <button class="btn-small" onclick="setBrush('marker')">Marker</button>
                <button class="btn-small" onclick="setBrush('pencil')">Pencil</button>
                <button class="btn-small" onclick="setBrush('highlighter')">Highlighter</button>
                <button class="btn-small" onclick="setBrush('eraser')">Eraser</button>
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span style="font-size: 0.7rem;">Color:</span>
                  <input type="color" id="draw-color" value="#000000" onchange="state.drawColor = this.value" style="width:35px; height:35px; border: 2px solid #ddd; border-radius: 6px; cursor: pointer;">
                </div>
                <div id="size-control" style="display:flex; align-items:center; gap:6px;">
                  <span style="font-size:0.7rem;">Size</span>
                  <input class="range-cute" type="range" min="2" max="30" value="8" style="width:100px;" oninput="updateBrushSize(this.value)">
                </div>
              </div>

              <!-- Text Menu -->
              <div id="text-menu" class="context-bar">
                <input id="text-edit" class="text-input" type="text" placeholder="Edit text..." oninput="updateActiveText(this.value)">
                <select id="text-font" onchange="updateActiveFont(this.value)" style="padding:5px; border-radius:10px; font-family:'Quicksand';">
                  <option value="Quicksand">Quicksand</option>
                  <option value="Nunito">Nunito</option>
                  <option value="Klee One">Klee One</option>
                  <option value="Pacifico">Pacifico</option>
                  <option value="Baloo 2">Baloo 2</option>
                  <option value="Comfortaa">Comfortaa</option>
                </select>
                <input type="color" id="text-color" oninput="updateActiveColor(this.value)" style="width:35px; height:35px; border: 2px solid #ddd; border-radius: 6px;" title="Text Color">
                <button class="btn-small" style="background:var(--delete-red); color:white;" onclick="deleteActiveObject()">Delete</button>
              </div>

              <!-- Tool Buttons -->
              <div class="tool-section">
                <button class="tool-btn" onclick="openMenu('filter-menu')">
                  <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9"/>
                  </svg>
                  <span>Filter</span>
                </button>

                <button class="tool-btn" onclick="openMenu('bg-menu')">
                  <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="2"/>
                  </svg>
                  <span>BG</span>
                </button>

                <button class="tool-btn" onclick="addText()">
                  <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="21" x2="20" y2="21"/>
                    <text x="8" y="14" font-size="10" font-weight="bold" fill="currentColor">A</text>
                  </svg>
                  <span>Text</span>
                </button>

                <button id="btn-draw" class="tool-btn" onclick="openMenu('draw-menu')">
                  <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L21 3z"/>
                  </svg>
                  <span>Draw</span>
                </button>

                <label class="tool-btn">
                  <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                    <path d="M21 15l-5-5-8 8-3-4"/>
                  </svg>
                  <span>Media</span>
                  <input type="file" hidden accept="image/*" onchange="addMedia(event)">
                </label>

                <button class="tool-btn" onclick="download()">
                  <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                  </svg>
                  <span>Save</span>
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
      <div class="side-light"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
